# Builds the Payaz Labels Android app (APK) and publishes it as a GitHub Release.
# Download on the tablet from:
#   https://github.com/colin-payaz/payaz-label-station/releases/latest/download/payaz-labels.apk
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Copy the web app into the Android project
        run: npm run build:web && npx cap sync android

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=Signed with the Payaz release key." >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a TEST app with a temporary key. Later builds won't install over it."
            echo "SIGNING=TEST BUILD (temporary key): uninstall it before installing a signed build." >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: payaz-labels
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk payaz-labels.apk

      - uses: actions/upload-artifact@v4
        with:
          name: payaz-labels-apk
          path: payaz-labels.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" payaz-labels.apk \
            --title "Payaz Labels 1.0.${{ github.run_number }}" \
            --notes "Install on the tablet: open this page in Chrome on the tablet and tap payaz-labels.apk. ${SIGNING}" \
            --latest
