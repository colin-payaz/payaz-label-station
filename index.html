<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#009BA9">
<title>Payaz Label Station</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<style>
@font-face { font-family: Montserrat; font-weight: 400; src: url(fonts/Montserrat-Regular.ttf); }
@font-face { font-family: Montserrat; font-weight: 500; src: url(fonts/Montserrat-Medium.ttf); }
@font-face { font-family: Montserrat; font-weight: 700; src: url(fonts/Montserrat-Bold.ttf); }
@font-face { font-family: Montserrat; font-weight: 900; src: url(fonts/Montserrat-Black.ttf); }
:root {
  --teal: #009BA9; --green: #76b729; --navy: #1f1a5c; --blue: #274777; --purple: #6b4399; --coral: #ef6e77;
  --bg: #f3f6f8; --card: #fff; --ink: #1f1a5c; --muted: #5d6b82; --line: #dce3ea;
  --grad: linear-gradient(90deg, var(--teal), var(--green)); --r: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body { font-family: Montserrat, sans-serif; background: var(--bg); color: var(--ink); }
button { font: inherit; color: inherit; border: 0; cursor: pointer; border-radius: var(--r); touch-action: manipulation; }
button:active { transform: scale(.97); }
button:focus { outline: none; }

header { height: 72px; background: var(--grad); display: flex; align-items: center; padding: 0 20px; gap: 14px; color: #fff; }
header img { height: 44px; }
header .title { font-weight: 700; font-size: 24px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .icon-btn { background: rgba(255,255,255,.2); color: #fff; height: 52px; min-width: 52px; padding: 0 18px; font-weight: 700; font-size: 20px; white-space: nowrap; }
.pill { background: rgba(255,255,255,.22); color: #fff; border-radius: 99px; height: 48px; padding: 0 18px; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.pill::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #ccc; }
.pill.ok::before { background: #b9ff7a; box-shadow: 0 0 6px #b9ff7a; }
.pill.bad { background: #b3263a; }
.pill.bad::before { background: #fff; }

.screen { display: none; height: calc(100% - 72px); padding: 18px 20px; }
.screen.on { display: flex; }

#home.on { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 16px; }
.big { color: #fff; font-size: 32px; font-weight: 900; text-align: left; padding: 24px 28px; display: flex; flex-direction: column; justify-content: flex-end; line-height: 1.1; }
.big small { display: block; font-size: 17px; font-weight: 500; margin-top: 8px; opacity: .92; }
.big.order  { background: linear-gradient(135deg, var(--green), #3fae5e); }
.big.sumup  { background: linear-gradient(135deg, var(--teal), #1f8fbf); }
.big.tablet { background: linear-gradient(135deg, var(--blue), var(--teal)); }
.big.all    { background: linear-gradient(135deg, var(--purple), var(--navy)); }

#edit { gap: 18px; }
.left { width: 40%; max-width: 460px; display: flex; flex-direction: column; gap: 8px; }
.right { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.field { background: var(--card); border: 3px solid var(--line); border-radius: var(--r); padding: 6px 14px; text-align: left; width: 100%; }
.field .lbl { font-size: 14px; font-weight: 700; color: var(--muted); }
.field .val { font-size: 26px; font-weight: 900; min-height: 34px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field .val.empty { color: #b4bfcc; font-weight: 500; font-size: 19px; line-height: 34px; }
.field.active { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0,155,169,.18); }
.preview { flex: 1; background: #d9e0e7; border-radius: var(--r); display: flex; align-items: center; justify-content: center; min-height: 0; padding: 10px; }
.preview canvas { max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.18); border-radius: 6px; image-rendering: pixelated; }
.panel { flex: 1; background: var(--card); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; min-height: 0; }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1; }
.keypad button, .kbd button { background: #eef2f6; font-size: 30px; font-weight: 700; }
.keypad button.pz { background: var(--navy); color: #fff; }
.keypad button.del, .kbd button.del { background: #fde7e9; color: #b3263a; }

.scan { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
.scan .beam { width: 170px; height: 90px; border: 4px solid var(--teal); border-radius: var(--r); position: relative; overflow: hidden;
  background: repeating-linear-gradient(90deg, var(--navy) 0 4px, transparent 4px 7px, var(--navy) 7px 9px, transparent 9px 14px); background-clip: content-box; padding: 14px; }
.scan .beam::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: var(--coral); top: 50%; animation: sweep 1.6s ease-in-out infinite alternate; }
@keyframes sweep { from { top: 12%; } to { top: 85%; } }
.scan h2 { margin: 0; font-size: 26px; font-weight: 900; }
.scan p { margin: 0; color: var(--muted); font-size: 17px; }
.scan .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ghost { background: #eef2f6; font-weight: 700; font-size: 18px; padding: 14px 22px; }
.ghost.cam { background: var(--teal); color: #fff; }

.kbd { display: none; flex-direction: column; gap: 6px; flex: 1; }
.kbd .row { display: flex; gap: 6px; flex: 1; }
.kbd button { flex: 1; font-size: 22px; padding: 0; }
.kbd button.wide { flex: 2; font-size: 16px; }

.actions { display: flex; gap: 12px; height: 76px; }
.actions .clear { background: #eef2f6; font-weight: 700; font-size: 20px; width: 120px; }
.copies { display: flex; align-items: center; background: #eef2f6; border-radius: var(--r); }
.copies button { background: transparent; width: 52px; height: 100%; font-size: 30px; font-weight: 700; }
.copies span { min-width: 64px; text-align: center; font-weight: 900; font-size: 22px; line-height: 1; }
.copies span small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
.print { flex: 1; background: var(--grad); color: #fff; font-size: 30px; font-weight: 900; letter-spacing: .5px; }
.print:disabled { opacity: .4; }

#settings { flex-direction: column; gap: 14px; overflow-y: auto; }
.card { background: var(--card); border-radius: var(--r); padding: 16px 18px; }
.card h3 { margin: 0 0 12px; font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { background: #eef2f6; padding: 14px 18px; font-weight: 700; font-size: 18px; border: 3px solid transparent; }
.chip.on { border-color: var(--teal); background: #e3f6f7; }
.chip.primary { background: var(--teal); color: #fff; }
.stepper { display: inline-flex; align-items: center; gap: 8px; margin-right: 22px; font-weight: 700; font-size: 18px; }
.stepper button { background: #eef2f6; width: 52px; height: 52px; font-size: 26px; font-weight: 700; }
.stepper b { min-width: 76px; text-align: center; font-size: 22px; }
.status { font-weight: 700; font-size: 17px; }
.status.ok { color: #2f8a3a; } .status.bad { color: #b3263a; }
.hint { color: var(--muted); font-size: 15px; margin-top: 10px; }

#overlay { position: fixed; inset: 0; background: rgba(31,26,92,.55); display: none; align-items: center; justify-content: center; z-index: 9; }
#overlay.on { display: flex; }
#overlay .box { background: #fff; border-radius: 20px; padding: 34px 40px; min-width: 460px; max-width: 760px; text-align: center; }
#overlay .msg { font-size: 30px; font-weight: 900; }
#overlay .sub { font-size: 18px; color: var(--muted); margin-top: 10px; }
#overlay .box.err .msg { color: #b3263a; }
#overlay button { margin-top: 22px; background: var(--navy); color: #fff; font-weight: 700; font-size: 22px; padding: 16px 48px; }

#camera { position: fixed; inset: 0; background: #000; display: none; z-index: 10; }
#camera.on { display: block; }
#camera video { width: 100%; height: 100%; object-fit: cover; }
#camera .frame { position: absolute; left: 15%; right: 15%; top: 32%; bottom: 32%; border: 4px solid #fff; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
#camera .msg { position: absolute; top: 18px; left: 0; right: 0; text-align: center; color: #fff; font-size: 22px; font-weight: 700; }
#camera button { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: #fff; font-weight: 700; font-size: 22px; padding: 16px 48px; }
</style>
</head>
<body>
<header>
  <img src="img/logo-white.png" alt="Payaz">
  <div class="title" id="hdrTitle">Label Station</div>
  <button class="pill bad" id="pill">Connect printer</button>
  <button class="icon-btn" id="backBtn" style="display:none">&#8592; Back</button>
  <button class="icon-btn" id="setBtn">&#9881; Settings</button>
</header>

<section id="home" class="screen on">
  <button class="big order"  data-go="order">Payaz Order<small>Type the order number</small></button>
  <button class="big sumup"  data-go="sumup">SumUp Card Reader<small>Scan the reader's barcode</small></button>
  <button class="big tablet" data-go="tablet">Tablet<small>Scan the tablet's serial barcode</small></button>
  <button class="big all"    data-go="all">Print All<small>Order, reader and tablet on one label</small></button>
</section>

<section id="edit" class="screen">
  <div class="left">
    <div id="fields"></div>
    <div class="preview" id="preview"></div>
  </div>
  <div class="right">
    <div class="panel">
      <div class="keypad" id="keypad">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button class="pz" data-k="PZ">PZ</button><button>0</button><button class="del" data-k="DEL">&#9003;</button>
      </div>
      <div class="scan" id="scan">
        <div class="beam"></div>
        <h2>Scan the barcode now</h2>
        <p>Use the barcode scanner, or the tablet's camera.</p>
        <div class="btns">
          <button class="ghost cam" id="camBtn">&#128247; Use camera</button>
          <button class="ghost" id="typeBtn">&#9000; Type it</button>
        </div>
      </div>
      <div class="kbd" id="kbd"></div>
    </div>
    <div class="actions">
      <button class="clear" id="clearBtn">Clear</button>
      <div class="copies"><button id="cMinus">&minus;</button><span><small>COPIES</small><b id="copies">1</b></span><button id="cPlus">+</button></div>
      <button class="print" id="printBtn">PRINT</button>
    </div>
  </div>
</section>

<section id="settings" class="screen">
  <div class="card">
    <h3>Printer</h3>
    <div class="status" id="pStatus"></div>
    <div class="chips" style="margin-top:12px">
      <button class="chip primary" id="connectBtn">Connect printer</button>
      <button class="chip" id="testBtn">Print a test label</button>
      <button class="chip" id="disconnectBtn">Disconnect</button>
    </div>
    <div class="hint">Switch the printer on, then tap Connect printer and choose the printer (its name starts with "T0").</div>
  </div>
  <div class="card">
    <h3>Label size</h3>
    <div class="chips" id="sizeChips"></div>
    <div style="margin-top:14px">
      <span class="stepper">Width <button data-d="widthMm:-1">&minus;</button><b id="wmm"></b><button data-d="widthMm:1">+</button></span>
      <span class="stepper">Height <button data-d="heightMm:-1">&minus;</button><b id="hmm"></b><button data-d="heightMm:1">+</button></span>
    </div>
  </div>
  <div class="card">
    <h3>Print</h3>
    <span class="stepper">Darkness <button data-d="density:-1">&minus;</button><b id="dens"></b><button data-d="density:1">+</button></span>
    <button class="chip" id="rotBtn">Flip label upside down: <span id="rotVal"></span></button>
    <button class="chip" id="reloadBtn" style="margin-left:10px">Restart app</button>
  </div>
</section>

<div id="overlay"><div class="box" id="ovBox"><div class="msg" id="ovMsg"></div><div class="sub" id="ovSub"></div><button id="ovBtn">OK</button></div></div>
<div id="camera"><video id="video" playsinline muted></video><div class="frame"></div><div class="msg">Point the camera at the barcode</div><button id="camClose">Cancel</button></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
